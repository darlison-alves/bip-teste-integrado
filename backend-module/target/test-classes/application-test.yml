spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop   # 🔥 cria e dropa tabela automaticamente
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never
